<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Athul Krishna — Voice AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name  { font: 700 58px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #E6EDF3; }
      .role  { font: 400 25px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #2DD4BF; letter-spacing: .5px; }
      .tag   { font: 400 16px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #8B949E; letter-spacing: 3px; }
      .bar   { fill: #2DD4BF; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- animated waveform bars, left cluster -->
  <g transform="translate(90 150)">
    <rect class="bar" x="0"   y="-14" width="6" height="28" rx="3" opacity="0.85">
      <animate attributeName="height" values="28;68;18;44;28" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-14;-34;-9;-22;-14" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect class="bar" x="14"  y="-24" width="6" height="48" rx="3" opacity="0.7">
      <animate attributeName="height" values="48;20;60;30;48" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-24;-10;-30;-15;-24" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect class="bar" x="28"  y="-34" width="6" height="68" rx="3" opacity="0.55">
      <animate attributeName="height" values="68;34;80;40;68" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-34;-17;-40;-20;-34" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect class="bar" x="42"  y="-20" width="6" height="40" rx="3" opacity="0.4">
      <animate attributeName="height" values="40;70;24;52;40" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-35;-12;-26;-20" dur="2.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- text block -->
  <text x="170" y="140" class="name">Athul Krishna</text>
  <text x="172" y="182" class="role">Voice AI Engineer</text>
  <text x="174" y="222" class="tag">LIVEKIT · SIP · STREAMING STT / LLM / TTS</text>

  <!-- flowing waveform line across bottom -->
  <path stroke="url(#wave)" stroke-width="2.5" fill="none"
        d="M0 262 Q 60 262 90 240 T 180 262 T 270 240 T 360 262 T 450 244 T 540 262 T 630 240 T 720 262 T 810 244 T 900 262 T 990 240 T 1080 262 T 1200 262">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- accent rule under text -->
  <rect x="170" y="196" width="300" height="2" rx="1" fill="url(#accent)"/>
</svg>
